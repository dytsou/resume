name: Deploy to Cloudflare

# Production (Pages + front-door manifest) only from main after CI succeeds.
# Worker preview snapshots for other branches are handled by Workers Builds
# via `pnpm run deploy:ci` (wrangler versions upload) — not this workflow.
on:
  workflow_run:
    workflows: [CI Checks]
    types:
      - completed
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reject-non-main-dispatch:
    if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Refuse non-main production deploy
        run: |
          echo "Production deploy is main-only. Use Workers Builds snapshot (versions upload) on feature branches."
          exit 1

  checks:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install Poppler
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Install TeX Live
        uses: zauguin/install-texlive@f5e7d0b117035fff797d4392ea94131747e03d60 # v4
        with:
          package_file: scripts/tex/tl_packages
          cache_version: 9

      - name: Build
        run: pnpm build
        env:
          # Served under the front door at dy.tsou.me/resume/, so assets must be prefixed.
          BASE_PATH: /resume/

      - name: Verify build output
        run: |
          test -f dist/index.html
          # Assets must be prefixed for the front-door mount at /resume/.
          grep -q '/resume/assets/' dist/index.html

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist
          path: dist
          retention-days: 1
          if-no-files-found: error

  deploy:
    needs: [checks]
    if: |
      always() &&
      (
        (github.event_name == 'workflow_run' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == 'main') ||
        (github.event_name == 'workflow_dispatch' &&
          github.ref == 'refs/heads/main' &&
          needs.checks.result == 'success')
      )
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    concurrency:
      group: ${{ github.workflow }}-main
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Download build artifact from CI
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist
          path: dist
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Download build artifact from checks
        if: github.event_name == 'workflow_dispatch'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist
          path: dist

      - name: Verify build output
        run: test -f dist/index.html

      - name: Deploy Pages and register front-door route
        uses: dytsou/cloudflare-subpath-deploy@1d47dbb638f9855ea97bdc302a1eafb0606a68ac # v1.0.0 (@v1)
        with:
          output-dir: dist
          manifest-repo: dytsou/site
          manifest-path: src/data/route-manifest.json
          create-pr: "true"
          deploy-worker: "false"
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare-account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          manifest-repo-token: ${{ secrets.MANIFEST_REPO_TOKEN }}
