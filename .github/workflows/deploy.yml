name: Deploy to Cloudflare Pages

on:
  workflow_run:
    workflows: [CI Checks]
    types:
      - completed
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build
        run: pnpm build
        env:
          # Served under the front door at dy.tsou.me/resume/, so assets must be prefixed.
          BASE_PATH: /resume/

      - name: Verify build output
        run: |
          test -f dist/index.html
          # Assets must be prefixed for the front-door mount at /resume/.
          grep -q '/resume/assets/' dist/index.html

      - name: Upload build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dist
          path: dist
          retention-days: 1
          if-no-files-found: error

  deploy:
    needs: [checks]
    if: |
      always() &&
      (
        (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
        (github.event_name == 'workflow_dispatch' && needs.checks.result == 'success')
      )
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Download build artifact from CI
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dist
          path: dist
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Download build artifact from checks
        if: github.event_name == 'workflow_dispatch'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dist
          path: dist

      - name: Verify build output
        run: test -f dist/index.html

      - name: Deploy Pages and register front-door route
        uses: dytsou/cloudflare-subpath-deploy@1d47dbb638f9855ea97bdc302a1eafb0606a68ac # v1.0.0 (@v1)
        with:
          output-dir: dist
          manifest-repo: dytsou/site
          manifest-path: src/data/route-manifest.json
          create-pr: "true"
          deploy-worker: "false"
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare-account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          manifest-repo-token: ${{ secrets.MANIFEST_REPO_TOKEN }}

      - name: Enable Markdown for Agents on dy.tsou.me
        # The primary URL (https://dy.tsou.me/resume/) is served by the front
        # door, not the Worker. Cloudflare's native "Markdown for Agents"
        # (content_converter) lets agents request text/markdown via Accept
        # negotiation with zero application code.
        # https://developers.cloudflare.com/fundamentals/reference/markdown-for-agents/
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        continue-on-error: true
        run: |
          set -euo pipefail
          # Fetch to a file and verify before parsing; never pipe a remote
          # payload straight into an interpreter.
          curl -s -f -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/zones?name=dy.tsou.me" -o zones.json
          if [ "$(jq -r '.success' zones.json)" != "true" ]; then
            echo "::warning::Cloudflare API error resolving dy.tsou.me; skipping Markdown for Agents enablement."
            jq -r '.errors' zones.json || true
            exit 0
          fi
          ZONE_ID="$(jq -r '.result[0].id // empty' zones.json)"
          if [ -z "${ZONE_ID}" ]; then
            echo "::warning::Could not resolve dy.tsou.me zone id; skipping Markdown for Agents enablement."
            exit 0
          fi
          curl -s -f -X PATCH \
            "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/settings/content_converter" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"value":"on"}' -o enable.json
          echo "Markdown for Agents enablement response:"; jq -r '.' enable.json
