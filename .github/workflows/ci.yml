name: CI Checks

on:
  push: # Runs on push to any branch
  pull_request: # Also runs on PRs to any branch
  workflow_dispatch:

jobs:
  format-writeback:
    name: Format and update PR
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Format with Biome
        id: format
        run: |
          pnpm run format
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push formatting changes
        if: steps.format.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git commit -m "style: format with Biome"
          gh auth setup-git
          git push origin "HEAD:${GITHUB_HEAD_REF}"
          if ! gh workflow run .github/workflows/ci.yml \
            --ref "${GITHUB_HEAD_REF}" \
            --repo "${GITHUB_REPOSITORY}"; then
            echo "::warning::Could not dispatch CI for the formatted commit."
          fi

  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Check formatting with Biome
        run: pnpm run format:check

      - name: Lint with Biome
        run: pnpm run lint

  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run tests
        run: pnpm test

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run TypeScript type check
        run: pnpm run typecheck

  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install TeX Live
        uses: zauguin/install-texlive@f5e7d0b117035fff797d4392ea94131747e03d60 # v4
        with:
          package_file: scripts/tex/tl_packages
          cache_version: convert-fidelity-v6

      - name: Build project
        run: pnpm run build
        env:
          # Served under the front door at dy.tsou.me/resume/, so assets must be prefixed.
          BASE_PATH: /resume/
          VITE_GOOGLE_DRIVE_RESUME_LINK: ${{ vars.VITE_GOOGLE_DRIVE_RESUME_LINK }}
          # Fail closed when certified convert cannot produce resume HTML+PDF.
          CONVERT_REQUIRE_CERTIFIED: '1'

      - name: Verify certified convert artifacts
        run: |
          test -f public/converted-docs/resume.html
          test -f public/converted-docs/resume.pdf
          test -s public/converted-docs/resume.pdf
          node --input-type=module -e "
            import { readFileSync } from 'node:fs';
            const manifest = JSON.parse(readFileSync('public/documents-manifest.json', 'utf8'));
            const resume = manifest.find((e) => e.id === 'resume');
            if (!resume) throw new Error('missing resume manifest entry');
            if (resume.lane !== 'certified') throw new Error('expected certified lane');
            if (!resume.sourceHash) throw new Error('missing sourceHash');
            if (!resume.pdfPath) throw new Error('missing pdfPath');
            console.log('certified-convert: ok', resume.converter ?? '');
          "
          test -f dist/converted-docs/resume.pdf || test -f dist/resume/converted-docs/resume.pdf

      - name: Verify build output
        if: github.ref == 'refs/heads/main'
        run: |
          test -f dist/index.html
          # Assets must be prefixed for the front-door mount at /resume/.
          grep -q '"/resume/assets/' dist/index.html \
            || grep -q "'/resume/assets/" dist/index.html \
            || grep -q '/resume/assets/' dist/index.html

      - name: Verify deploy contract
        if: github.ref == 'refs/heads/main'
        run: |
          node --input-type=module -e "
            import { readFileSync, existsSync } from 'node:fs';
            const c = JSON.parse(readFileSync('deploy-contract.json', 'utf8'));
            if (c.ownerRepo !== 'dytsou/resume') throw new Error('ownerRepo');
            if (c.outputDir !== 'dist') throw new Error('outputDir');
            if (!existsSync('dist/index.html')) throw new Error('missing dist/index.html');
            console.log('verify-deploy-contract: ok');
          "

      - name: Upload build artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dist
          path: dist
          retention-days: 1
          if-no-files-found: error
