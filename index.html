    content="Resume of Dong-You Tsou, including software engineering experience at LINE Taiwan Limited, research at NYCU labs, and selected projects." />

  <title>Dong-You Tsou — Resume</title>
  <!-- RESUME_ASSETS -->
  <!-- RESUME_STYLES -->
  <script id="theme-bootstrap">
    try {
      if (window.localStorage.getItem('resume-theme') === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    } catch {
      // Keep the light baseline when storage is unavailable.
    }
  </script>

<body>
  <div id="resume-content">
    <!-- RESUME_CONTENT -->
  </div>
  <div class="theme-control">
    <button type="button" class="theme-toggle" aria-pressed="false" aria-label="Toggle dark mode">Dark mode</button>
  </div>
  <script>
    const themeToggle = document.querySelector('.theme-toggle');
    const isDarkTheme = document.documentElement.getAttribute('data-theme') === 'dark';

    themeToggle.setAttribute('aria-pressed', String(isDarkTheme));
    themeToggle.textContent = isDarkTheme ? 'Light mode' : 'Dark mode';
  </script>
  <!-- DOWNLOAD_BUTTON -->
  <script type="module" src="/src/main.js"></script>
</body>

</html>
