<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/assets/favicon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="Resume of Dong-You Tsou, including software engineering experience at LINE Taiwan Limited, research at NYCU labs, and selected projects." />
  <link rel="canonical" href="https://dy.tsou.me/resume/" />
  <meta property="og:title" content="Dong-You Tsou — Resume" />
  <meta property="og:description"
    content="Resume of Dong-You Tsou, including software engineering experience at LINE Taiwan Limited, research at NYCU labs, and selected projects." />
  <meta property="og:type" content="profile" />
  <meta property="og:url" content="https://dy.tsou.me/resume/" />
  <title>Dong-You Tsou — Resume</title>
  <!-- RESUME_ASSETS -->
  <!-- RESUME_STYLES -->
  <script id="theme-bootstrap">
    try {
      if (window.localStorage.getItem('resume-theme') === 'dark') {
        document.documentElement.dataset.theme = 'dark';
      }
    } catch {
      // Keep the light baseline when storage is unavailable.
    }
  </script>

<body>
  <div id="resume-content">
    <!-- RESUME_CONTENT -->
  </div>
  <script>
    const themeToggle = document.querySelector('.theme-toggle');
    if (themeToggle) {
      const isDarkTheme = document.documentElement.dataset.theme === 'dark';
      const nextThemeLabel = isDarkTheme ? 'light' : 'dark';

      themeToggle.setAttribute('aria-pressed', String(isDarkTheme));
      themeToggle.setAttribute('aria-label', `Switch to ${nextThemeLabel} mode`);
      themeToggle.textContent = `Switch to ${nextThemeLabel} mode`;
    }
  </script>
  <!-- DOWNLOAD_BUTTON -->
  <script type="module" src="/src/main.js"></script>
</body>

</html>
